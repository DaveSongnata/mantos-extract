<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Mantos Extract — Instalador</title>
<!--
  Mantos Extract installer — WebView2 wizard UI. FULLY OFFLINE: no CDN, no webfonts, no
  external URLs. Same Swiss Style tokens as ../../src/MantosExtract.AddIn/wwwroot/index.html
  (paleta vermelho/preto/branco/cinza, raio ZERO, Arial Black) — o instalador é a primeira tela
  que o cliente vê, não pode destoar do resto do produto.
  3 passos (mais simples que o Optimus: sem módulo de manutenção separado aqui):
    JS→C#: postMessage({action:'install'}) / 'close' / 'drag' / 'minimize'
    C#→JS: {type:'progress'|'done', ...}
-->
<style>
:root{
  --paper:#f2f0ea; --surface:#ffffff; --ink:#121212;
  --red:#e0271c; --red-dark:#9c150f;
  --gray:#b7b6b0; --gray-light:#e3e1d8;
  --lw:2px;
  --font:"Arial Black",Arial,"Helvetica Neue",sans-serif;
  --font-body:Arial,"Helvetica Neue",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{display:flex;flex-direction:column;height:100%;background:var(--paper);
  font-family:var(--font-body);color:var(--ink);-webkit-font-smoothing:antialiased;
  user-select:none;overflow:hidden;font-size:13px;line-height:1.4}
button{font-family:var(--font-body)}

/* title bar */
.titlebar{flex:0 0 36px;height:36px;display:flex;align-items:center;justify-content:space-between;
  background:var(--surface);border-bottom:var(--lw) solid var(--ink)}
.tb-drag{display:flex;align-items:center;gap:8px;flex:1;height:100%;padding:0 14px}
.tb-mark{width:14px;height:14px;flex:0 0 14px;background:var(--red)}
.tb-title{font-family:var(--font);font-size:10.5px;font-weight:900;text-transform:uppercase;letter-spacing:.04em;color:var(--ink)}
.tb-btns{display:flex;height:100%}
.tb-btn{width:44px;height:36px;display:flex;align-items:center;justify-content:center;border:0;border-left:1px solid var(--gray-light);background:transparent;
  color:var(--ink);cursor:pointer}
.tb-btn svg{width:11px;height:11px}
.tb-btn:hover{background:var(--gray-light)}
.tb-close:hover{background:var(--red);color:#fff}
.shell{flex:1;min-height:0;display:flex}

/* sidebar */
.sidebar{width:240px;flex:0 0 240px;display:flex;flex-direction:column;background:var(--ink);color:#fff;border-right:var(--lw) solid var(--ink)}
.sb-brand{padding:26px 22px 20px;border-bottom:1px solid rgba(255,255,255,.14)}
.sb-mark{width:34px;height:34px;background:var(--red);display:flex;align-items:center;justify-content:center;margin-bottom:12px}
.sb-mark span{font-family:var(--font);font-weight:900;font-size:16px;color:#fff}
.sb-name{font-family:var(--font);font-weight:900;font-size:17px;letter-spacing:-.01em;line-height:1.1;text-transform:uppercase}
.sb-ver{margin-top:4px;font-size:10px;color:rgba(255,255,255,.45);letter-spacing:.04em}
.sb-steps{flex:1;padding:18px 0;display:flex;flex-direction:column}
.sb-step{display:flex;align-items:center;gap:12px;padding:11px 22px;border-left:3px solid transparent}
.sb-step.active{border-left-color:var(--red);background:rgba(255,255,255,.06)}
.sb-num{width:22px;height:22px;flex:0 0 22px;display:flex;align-items:center;justify-content:center;
  font-family:var(--font);font-size:11px;font-weight:900;border:1.5px solid rgba(255,255,255,.35);color:rgba(255,255,255,.5)}
.sb-num.active{background:var(--red);border-color:var(--red);color:#fff}
.sb-num.done{background:#fff;border-color:#fff;color:var(--ink)}
.sb-label{font-size:12.5px;letter-spacing:.01em;color:rgba(255,255,255,.45)}
.sb-step.active .sb-label{color:#fff;font-weight:700}
.sb-step.done .sb-label{color:rgba(255,255,255,.7)}
.sb-foot{padding:16px 22px;border-top:1px solid rgba(255,255,255,.14);font-size:9.5px;color:rgba(255,255,255,.35);letter-spacing:.03em}

/* main */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;background:var(--paper)}
#page{flex:1;overflow-y:auto;padding:36px 44px}
.navbar{display:flex;align-items:center;justify-content:space-between;border-top:var(--lw) solid var(--ink);padding:16px 44px;background:var(--surface)}

.bar{display:flex;align-items:stretch;margin-bottom:22px}
.bar .tab{width:8px;flex:0 0 8px;background:var(--red)}
.bar .lbl{background:var(--ink);color:#fff;font-family:var(--font);font-size:11px;font-weight:900;text-transform:uppercase;letter-spacing:.08em;padding:8px 14px;display:flex;align-items:center}

.h1{font-family:var(--font);font-weight:900;font-size:26px;letter-spacing:-.01em;line-height:1.05;text-transform:uppercase}
.h2{font-family:var(--font);font-weight:900;font-size:18px;letter-spacing:-.005em;text-transform:uppercase}
.lead{font-size:13px;color:var(--ink);opacity:.72;line-height:1.55;margin-top:10px;max-width:52ch}

.btn-primary{background:var(--red);color:#fff;border:var(--lw) solid var(--ink);border-radius:0;padding:12px 24px;
  display:inline-flex;align-items:center;justify-content:center;gap:9px;cursor:pointer;
  font-family:var(--font);font-weight:900;font-size:11px;letter-spacing:.1em;text-transform:uppercase;min-height:44px}
.btn-primary:hover{background:var(--red-dark)}
.btn-primary:disabled{opacity:.4;cursor:default;background:var(--gray)}
.btn-ghost{background:var(--surface);border:var(--lw) solid var(--ink);border-radius:0;padding:11px 22px;cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center;font-family:var(--font);font-weight:900;font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink);min-height:44px}
.btn-ghost:hover{background:var(--gray-light)}
.btn-link{background:none;border:none;cursor:pointer;font-size:12px;color:var(--ink);opacity:.55;text-decoration:underline}
.btn-link:hover{opacity:.9}
.navbtns{display:flex;gap:12px}

/* welcome */
.welcome{display:flex;flex-direction:column;padding:4px 0}
.feat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:2px;width:100%;max-width:560px;margin-top:26px;background:var(--ink)}
.feat{background:var(--surface);padding:16px 17px}
.feat .num{font-family:var(--font);font-size:11px;font-weight:900;color:var(--red)}
.feat .ft{font-family:var(--font);font-weight:900;font-size:12.5px;text-transform:uppercase;margin-top:6px}
.feat .fd{font-size:11.5px;opacity:.65;line-height:1.45;margin-top:4px}
.note{display:flex;gap:9px;align-items:flex-start;margin-top:24px;padding:12px 14px;background:var(--gray-light);border-left:3px solid var(--ink);font-size:12px;line-height:1.5;max-width:52ch}

/* installing */
.prog-head{display:flex;align-items:baseline;justify-content:space-between;margin-top:6px;max-width:520px}
.prog-stage{font-family:var(--font);font-weight:900;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--red)}
.prog-pct{font-family:var(--font);font-size:16px;font-weight:900;font-variant-numeric:tabular-nums}
.prog-track{height:14px;background:var(--surface);border:var(--lw) solid var(--ink);margin-top:9px;max-width:520px;position:relative}
#progress-fill{height:100%;background:var(--red);transition:width .35s ease}
.stage-list{margin-top:26px;display:flex;flex-direction:column;max-width:520px}
.stage{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--gray-light)}
.stage:last-child{border-bottom:none}
.stage .st-ic{width:18px;height:18px;flex:0 0 18px;display:flex;align-items:center;justify-content:center;border:1.5px solid var(--gray)}
.stage .st-ic .dot{width:5px;height:5px;background:var(--gray)}
.stage .st-nm{flex:1;font-size:12.5px;opacity:.55}
.stage.done .st-ic{background:var(--ink);border-color:var(--ink)}
.stage.done .st-nm{opacity:.85}
.stage.cur .st-ic{border-color:var(--red)}
.stage.cur .st-nm{font-weight:700;opacity:1}
.st-check{width:100%;height:100%;color:#fff}
.spinner{width:10px;height:10px;border:2px solid var(--red);border-top-color:transparent;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* done */
.done-wrap{display:flex;flex-direction:column;padding:4px 0}
.done-badge{width:56px;height:56px;display:flex;align-items:center;justify-content:center;border:var(--lw) solid var(--ink);margin-bottom:16px}
.done-badge.ok{background:var(--ink)} .done-badge.ok svg{width:26px;height:26px;color:#fff}
.done-badge.fail{background:var(--red)} .done-badge.fail svg{width:26px;height:26px;color:#fff}
.next-box{width:100%;max-width:460px;border:var(--lw) solid var(--ink);background:var(--surface);padding:18px 20px;margin-top:22px}
.next-box ol{list-style:none;margin:10px 0 0;display:flex;flex-direction:column;gap:9px;counter-reset:step}
.next-box li{font-size:12.5px;line-height:1.5;padding-left:26px;position:relative;counter-increment:step}
.next-box li::before{content:counter(step);position:absolute;left:0;top:0;width:18px;height:18px;background:var(--red);color:#fff;
  font-family:var(--font);font-size:10px;font-weight:900;display:flex;align-items:center;justify-content:center}
.next-box li b{font-weight:700}
.next-foot{border-top:1px solid var(--gray-light);margin-top:14px;padding-top:11px;font-size:11px;opacity:.6}
.err-box{width:100%;max-width:460px;border:var(--lw) solid var(--red);background:var(--surface);padding:14px 16px;margin-top:20px;
  font-family:monospace;font-size:11.5px;color:var(--red-dark);word-break:break-all;line-height:1.55}
kbd{font-family:monospace;font-size:11px;background:var(--gray-light);border:1px solid var(--ink);padding:1px 6px}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation-duration:.001ms !important;transition-duration:.001ms !important}}
</style>
</head>
<body>

<div class="titlebar">
  <div class="tb-drag" id="tb-drag">
    <span class="tb-mark"></span>
    <span class="tb-title">Mantos Extract — Instalador</span>
  </div>
  <div class="tb-btns">
    <button class="tb-btn" id="tb-min" title="Minimizar"><svg viewBox="0 0 12 12"><rect x="2" y="5.4" width="8" height="1.2" fill="currentColor"/></svg></button>
    <button class="tb-btn tb-close" id="tb-close" title="Fechar"><svg viewBox="0 0 12 12"><path d="M3 3l6 6M9 3l-6 6" stroke="currentColor" stroke-width="1.4" fill="none" stroke-linecap="round"/></svg></button>
  </div>
</div>

<div class="shell">
<aside class="sidebar">
  <div class="sb-brand">
    <div class="sb-mark"><span>M</span></div>
    <div class="sb-name">Mantos Extract</div>
    <div class="sb-ver">INSTALADOR &middot; v0.1</div>
  </div>
  <nav id="sidebar-steps" class="sb-steps"></nav>
  <div class="sb-foot">© 2026 AISTEN LAB TECHNOLOGY</div>
</aside>

<main class="main">
  <div id="page"></div>
  <div class="navbar">
    <button id="btn-cancel" onclick="chromeSend({action:'close'})" class="btn-link">Cancelar</button>
    <div class="navbtns">
      <button id="btn-next" onclick="advance()" class="btn-primary">Instalar →</button>
    </div>
  </div>
</main>
</div>

<script>
var step = 0, installing = false, finishOk = false, finishErr = '';
var progressPct = 0;
var STEPS = ['Bem-vindo', 'Instalando', 'Concluído'];
var INSTALL_STAGES = ['Verificando o CorelDRAW', 'Copiando os arquivos', 'Registrando o addon'];
var STAGE_BOUNDS = [30, 75, 100];
var instStage = 0, animDone = false, realDone = false, realOk = false, instTimer = null;

function renderSidebar(){
  document.getElementById('sidebar-steps').innerHTML = STEPS.map(function(label,i){
    var done=i<step, active=i===step, stepCls=active?'active':done?'done':'todo', numCls=stepCls;
    var inner = done ? '<svg viewBox="0 0 24 24" width="11" height="11"><path fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" d="M4.5 12.75l6 6 9-13.5"/></svg>' : String(i+1);
    return '<div class="sb-step '+stepCls+'"><span class="sb-num '+numCls+'">'+inner+'</span><span class="sb-label">'+label+'</span></div>';
  }).join('');
}
function renderNav(){
  var cancel=document.getElementById('btn-cancel'), next=document.getElementById('btn-next');
  cancel.style.display = (step === 0) ? '' : 'none';
  if (step === 2){ next.textContent='Fechar'; next.disabled=false; next.style.display=''; }
  else if (step === 1){ next.style.display='none'; }
  else { next.textContent='Instalar →'; next.disabled=false; next.style.display=''; }
}
function renderPage(){
  var el=document.getElementById('page');
  el.innerHTML=[pageBemVindo,pageInstalando,pageConcluido][step]();
}
function render(){ renderSidebar(); renderPage(); renderNav(); }
function advance(){
  if (step===2){ chromeSend({action:'close'}); return; }
  if (step===0){ doInstall(); return; }
}

function bar(label){ return '<div class="bar"><span class="tab"></span><span class="lbl">'+esc(label)+'</span></div>'; }

// ── page: Bem-vindo ──
function pageBemVindo(){
  return '<div class="welcome">'
    + bar('Passo 1 de 3')
    + '<h1 class="h1">Bem-vindo ao<br>Mantos Extract</h1>'
    + '<p class="lead">Extrai a estampa de uma foto real de roupa, com IA, direto de dentro do CorelDRAW. Faz upscale e importa pronta pro canvas.</p>'
    + '<div class="feat-grid">'
    + feat('01','Detecção por IA','A foto entra, os elementos de estampa saem marcados — você confirma antes de gastar crédito.')
    + feat('02','Fundo transparente','Cada elemento confirmado sai recortado, pronto pra sobrepor no molde.')
    + feat('03','Upscale local','2× de resolução antes de entrar no documento, sem depender de internet.')
    + feat('04','100% no Corel','Um botão na barra de ferramentas — sem trocar de programa.')
    + '</div>'
    + '<div class="note">O CorelDRAW precisa estar <b>fechado</b> durante a instalação. Feche-o antes de clicar em Instalar.</div>'
    + '</div>';
}
function feat(num,title,desc){ return '<div class="feat"><div class="num">'+num+'</div><div class="ft">'+esc(title)+'</div><div class="fd">'+esc(desc)+'</div></div>'; }

// ── page: Instalando ──
function pageInstalando(){
  var rows=INSTALL_STAGES.map(function(label,i){
    var done=i<instStage,cur=i===instStage;
    var icon=done?'<svg class="st-check" fill="none" viewBox="0 0 24 24" stroke-width="3" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M4.5 12.75l6 6 9-13.5"/></svg>'
      :cur?'<span class="spinner"></span>':'<span class="dot"></span>';
    return '<div class="stage '+(done?'done':cur?'cur':'')+'"><span class="st-ic">'+icon+'</span><span class="st-nm">'+esc(label)+'</span></div>';
  }).join('');
  return '<div>'
    + bar('Passo 2 de 3')
    + '<h2 class="h2">Instalando</h2><p class="lead">Leva só um instante.</p>'
    + '<div class="prog-head"><span class="prog-stage" id="stage-lbl">'+esc(INSTALL_STAGES[instStage])+'</span><span class="prog-pct" id="pct-lbl">'+progressPct+'%</span></div>'
    + '<div class="prog-track"><div id="progress-fill" style="width:'+progressPct+'%"></div></div>'
    + '<div class="stage-list" id="stage-list">'+rows+'</div></div>';
}

// ── page: Concluído ──
function pageConcluido(){
  if (finishOk){
    return '<div class="done-wrap">'
      + bar('Passo 3 de 3')
      + '<div class="done-badge ok"><svg fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M4.5 12.75l6 6 9-13.5"/></svg></div>'
      + '<h2 class="h1" style="font-size:22px">Instalação concluída</h2>'
      + '<p class="lead">O Mantos Extract foi instalado no CorelDRAW.</p>'
      + '<div class="next-box"><div class="prog-stage" style="margin-bottom:4px">Como usar</div>'
      + '<ol><li>Abra o <b>CorelDRAW</b> e a foto da peça</li>'
      + '<li>Clique no botão <b>Mantos Extract</b> na barra de ferramentas</li>'
      + '<li>Faça login com sua conta e confirme os elementos detectados</li></ol>'
      + '<div class="next-foot">Não apareceu o botão? Reabra o CorelDRAW segurando <kbd>F8</kbd>.</div></div></div>';
  }
  return '<div class="done-wrap">'
    + bar('Passo 3 de 3')
    + '<div class="done-badge fail"><svg fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg></div>'
    + '<h2 class="h1" style="font-size:22px">Falha na instalação</h2>'
    + '<p class="lead">Ocorreu um erro durante a instalação.</p>'
    + (finishErr?'<div class="err-box">'+esc(finishErr)+'</div>':'')
    + '<p style="margin-top:16px;font-size:12px;opacity:.65">Feche o CorelDRAW, execute como Administrador e tente novamente.</p></div>';
}

// ── install ──
function doInstall(){
  step=1; installing=true; progressPct=0; instStage=0; animDone=false; realDone=false; realOk=false;
  render();
  chromeSend({action:'install'});
  startStagedAnim();
}
function startStagedAnim(){
  if (instTimer) clearInterval(instTimer);
  var t0=Date.now(), DURATION=2600;
  instTimer=setInterval(function(){
    var k=Math.min(1,(Date.now()-t0)/DURATION);
    var eased=k<0.85?(1-Math.pow(1-k/0.85,2))*0.88:0.88+(k-0.85)/0.15*0.12;
    progressPct=Math.round(eased*100);
    var st=0; for (var i=0;i<STAGE_BOUNDS.length;i++){ if (progressPct>=STAGE_BOUNDS[i]) st=i+1; }
    instStage=Math.min(st,INSTALL_STAGES.length-1);
    paintInstall();
    if (k>=1){ clearInterval(instTimer); instTimer=null; animDone=true; maybeFinish(); }
  },80);
}
var _lastStage=-1;
function paintInstall(){
  if (step!==1) return;
  var fill=document.getElementById('progress-fill'), lbl=document.getElementById('pct-lbl'), sl=document.getElementById('stage-lbl');
  if (fill) fill.style.width=progressPct+'%';
  if (lbl) lbl.textContent=progressPct+'%';
  if (sl) sl.textContent=INSTALL_STAGES[instStage];
  if (instStage!==_lastStage){ _lastStage=instStage; renderPage(); }
}
function maybeFinish(){
  if (!(animDone && realDone)) return;
  installing=false; finishOk=realOk; step=2; render();
}

// ── C# → JS ──
window.chrome.webview.addEventListener('message', function(e){
  var d=e.data;
  if (d.type==='done'){
    realDone=true; realOk=d.success===true; finishErr=d.error||'';
    if (!realOk){ if (instTimer){ clearInterval(instTimer); instTimer=null; } installing=false; finishOk=false; step=2; render(); }
    else maybeFinish();
  }
});

function chromeSend(obj){ window.chrome.webview.postMessage(obj); }
(function(){
  var drag=document.getElementById('tb-drag'); if(drag) drag.addEventListener('mousedown',function(e){ if(e.button===0) chromeSend({action:'drag'}); });
  var min=document.getElementById('tb-min'); if(min) min.addEventListener('click',function(){ chromeSend({action:'minimize'}); });
  var cl=document.getElementById('tb-close'); if(cl) cl.addEventListener('click',function(){ chromeSend({action:'close'}); });
})();
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
render();
</script>
</body>
</html>
